{% extends "base.html" %}
{% block titulo %}Gerador de senhas{% endblock %}

{% block conteudo %}
<section class="senhas">
  <h1>Gerador de senhas</h1>

  <form id="form-senha" class="formulario" novalidate>
    <label for="tamanho">Tamanho da senha</label>
    <input id="tamanho" name="tamanho" type="number" min="{{ tamanho_minimo }}" max="{{ tamanho_maximo }}" value="12" inputmode="numeric">

    <label for="quantidade">Quantidade de senhas</label>
    <input id="quantidade" name="quantidade" type="number" min="1" max="{{ quantidade_maxima }}" value="1" inputmode="numeric">

    <fieldset>
      <legend>Tipos de caractere</legend>
      <label><input type="checkbox" name="tipos" value="minusculas" checked> Minúsculas (a–z)</label>
      <label><input type="checkbox" name="tipos" value="maiusculas" checked> Maiúsculas (A–Z)</label>
      <label><input type="checkbox" name="tipos" value="numeros" checked> Números (0–9)</label>
      <label><input type="checkbox" name="tipos" value="simbolos"> Símbolos (!@#$…)</label>
    </fieldset>

    <label class="opcao"><input type="checkbox" name="sem_parecidos"> Evitar caracteres parecidos (0, O, 1, l, I)</label>

    <button id="gerar" type="submit">Gerar senha</button>
  </form>

  <p id="mensagem-senha" class="mensagem" aria-live="polite"></p>

  <ul id="lista-senhas" class="lista-senhas"></ul>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='senhas.js') }}"></script>
{% endblock %}
