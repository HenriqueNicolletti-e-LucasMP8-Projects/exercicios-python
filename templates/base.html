<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Exercícios Python{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>
  <nav class="menu">
    <a href="{{ url_for('inicio') }}" class="{{ 'ativo' if pagina == 'inicio' }}">Início</a>
    {% for exercicio in exercicios %}
      {% if exercicio.rota %}
        <a href="{{ url_for(exercicio.rota) }}" class="{{ 'ativo' if exercicio.rota == 'pagina_' ~ pagina }}">{{ exercicio.nome }}</a>
      {% else %}
        <span class="desativado" title="Em breve">{{ exercicio.nome }}</span>
      {% endif %}
    {% endfor %}
  </nav>
  <main>
    {% block conteudo %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
