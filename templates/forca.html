{% extends "base.html" %}
{% block titulo %}Forca{% endblock %}

{% block conteudo %}
<section class="forca">
  <h1>Jogo da Forca</h1>

  <div class="forca-topo">
    <label for="dificuldade">Dificuldade</label>
    <select id="dificuldade">
      <option value="aleatoria">Aleatória</option>
      <option value="facil">Fácil (até 6 letras)</option>
      <option value="medio">Média (7 a 8 letras)</option>
      <option value="dificil">Difícil (9+ letras)</option>
    </select>
    <p id="placar" class="placar" aria-live="polite"></p>
  </div>

  <svg id="boneco" viewBox="0 0 240 260" width="240" height="260" aria-label="Forca">
    <g class="estrutura">
      <line x1="30" y1="240" x2="150" y2="240"/>
      <line x1="60" y1="240" x2="60" y2="20"/>
      <line x1="60" y1="20" x2="150" y2="20"/>
      <line x1="150" y1="20" x2="150" y2="50"/>
    </g>
    <g class="partes">
      <circle cx="150" cy="70" r="20"/>
      <line x1="150" y1="90" x2="150" y2="160"/>
      <line x1="150" y1="105" x2="120" y2="135"/>
      <line x1="150" y1="105" x2="180" y2="135"/>
      <line x1="150" y1="160" x2="120" y2="205"/>
      <line x1="150" y1="160" x2="180" y2="205"/>
    </g>
  </svg>

  <p id="dica" class="dica"></p>
  <p id="palavra" class="palavra" aria-live="polite"></p>
  <p id="erros" class="erros"></p>
  <p id="mensagem" class="mensagem" aria-live="polite"></p>

  <div id="teclado" class="teclado"></div>

  <button id="novo-jogo" type="button">Novo jogo</button>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='forca.js') }}"></script>
{% endblock %}
